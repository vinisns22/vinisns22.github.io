# Blog do Pinterest Engine (GitHub Pages + Jekyll, tema minima).
# Os posts (_posts/) e as imagens (assets/img/) chegam por commit do n8n (workflow "PIN - Produção de artigo").
# Ao trocar para domínio próprio: mudar `url` aqui, criar CNAME e configurar o domínio no GitHub Pages.
title: The Calm Desk
description: Practical, calm ideas for desk setups, home offices and workspaces that help you focus.
url: "https://calmdesksetup.com"
baseurl: ""
lang: en-US
timezone: America/Sao_Paulo
# Cloudflare Web Analytics (sem cookies; token público do beacon, não é segredo). Vazio = sem medição.
cloudflare_analytics_token: "424967de38d749a0ac663c1c13adb8e4"
# Verificação do Google Search Console (jekyll-seo-tag gera a meta google-site-verification; valor público).
webmaster_verifications:
  google: "0npXU2fdj732oxEHWyjxVDlqHnxJM1A3EOcSGzIULS8"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:title/
show_excerpts: true
header_pages:
  - about.md
  - privacy.md

exclude:
  - README.md
